<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flitter | Flawnson</title>
    <meta name="description" content="Infinite feed of Fwitter micro-posts by Flawnson.">
    <link rel="canonical" href="https://flawnson.com/fwitter/">
    <link rel="icon" type="image/png" href="../assets/images/Favicon.png">
    <link rel="stylesheet" href="../assets/css/bootstrap.css">
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/fwitter.css">
</head>
<body>
<div class="container-fluid fwitter-shell">
    <div class="row">
        <div class="col-md-10 col-md-offset-1 col-lg-8 col-lg-offset-2">
            <div class="fwitter-inner">
                <header class="fwitter-header">
                    <p class="fwitter-kicker"><a href="../index.html">← flawnson.com</a></p>
                    <h1 class="fwitter-title">Fwitter</h1>
                    <p class="fwitter-subtitle">Infinite stream of all my fweets.</p>
                </header>

                <main id="fwitter-feed" class="fwitter-feed" aria-live="polite">
                    <p id="feed-status" class="feed-status">Loading...</p>
                </main>

                <div id="feed-sentinel" class="feed-sentinel" aria-hidden="true"></div>
            </div>
        </div>
    </div>
</div>
<script src="../assets/js/fwitter.js"></script>
</body>
</html>
