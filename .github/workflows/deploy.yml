name: Deploy to cPanel

on:
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        # The download occasionally hangs forever and eats the whole job timeout,
        # so bound each attempt and retry instead.
        run: |
          for i in 1 2 3; do
            timeout 300 npx playwright install --with-deps chromium && exit 0
            echo "Playwright install attempt $i failed or hung; retrying..."
          done
          exit 1

      - name: Run smoke tests
        run: npm run test:e2e

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        # apt on the runners occasionally hangs forever (often IPv6 to the
        # mirrors), so force IPv4, bound each attempt, and retry.
        run: |
          for i in 1 2 3; do
            timeout 180 sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 update \
              && timeout 180 sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 install -y lftp \
              && exit 0
            echo "apt attempt $i failed or hung; retrying..."
            sleep 5
          done
          exit 1

      - name: Deploy via SFTP (direct lftp)
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          SFTP_TARGET_DIR: ${{ secrets.SFTP_TARGET_DIR }}
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASS" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
          set net:timeout 20
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 20
          set sftp:auto-confirm yes
          set xfer:clobber on
          mirror -R --only-newer --verbose=2 \
            --exclude-glob .git* \
            --exclude .github/ \
            --exclude .idea/ \
            --exclude node_modules/ \
            --exclude .DS_Store \
            ./ "$SFTP_TARGET_DIR"
          bye
          EOF
