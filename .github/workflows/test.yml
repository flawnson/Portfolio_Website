name: Site Smoke Tests

on:
  pull_request:
  push:
    branches-ignore:
      - gh-pages

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        # The download occasionally hangs forever and eats the whole job timeout,
        # so bound each attempt and retry instead.
        run: |
          for i in 1 2 3; do
            timeout 300 npx playwright install --with-deps chromium && exit 0
            echo "Playwright install attempt $i failed or hung; retrying..."
          done
          exit 1

      - name: Run smoke tests
        run: npm run test:e2e
